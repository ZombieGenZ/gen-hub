name: Sync Monorepo to Polyrepos

on:
  push:
    branches:
      - master
    paths:
      - 'client/**'
      - 'server/**'
      - 'status/**'
      - 'admin-panel/database-panel/**'
      - 'admin-panel/feature-flag-panel/**'
      - 'admin-panel/resources-panel/**'

  workflow_dispatch:

jobs:
  sync-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push Client folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'client'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_CLIENT }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync client: ${{ github.event.head_commit.message }}"

  sync-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push Server folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'server'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_SERVER }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync server: ${{ github.event.head_commit.message }}"

  sync-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push status folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'status'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_STATUS }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync status: ${{ github.event.head_commit.message }}"

  sync-database-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push database-panel folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'admin-panel/database-panel'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_DATABASE_PANEL }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync database-panel: ${{ github.event.head_commit.message }}"

  sync-feature-flag-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push feature-flag-panel folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'admin-panel/feature-flag-panel'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_FEATURE_FLAG_PANEL }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync feature-flag-panel: ${{ github.event.head_commit.message }}"

  sync-resources-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push resources-panel folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'admin-panel/resources-panel'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_RESOURCES_PANEL }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync resources-panel: ${{ github.event.head_commit.message }}"