name: Sync Monorepo to Polyrepos

on:
  push:
    branches:
      - master
    paths:
      - 'client/**'
      - 'server/**'
      - 'status/**'
      - 'admin/database-panel/**'
      - 'admin/feature-flag-panel/**'
      - 'admin/resources-panel/**'
      - 'admin/admin-panel/**'

  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      status: ${{ steps.filter.outputs.status }}
      database_panel: ${{ steps.filter.outputs.database_panel }}
      feature_flag_panel: ${{ steps.filter.outputs.feature_flag_panel }}
      resources_panel: ${{ steps.filter.outputs.resources_panel }}
      admin_panel: ${{ steps.filter.outputs.admin_panel }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'
            status:
              - 'status/**'
            database_panel:
              - 'admin/database-panel/**'
            feature_flag_panel:
              - 'admin/feature-flag-panel/**'
            resources_panel:
              - 'admin/resources-panel/**'
            admin_panel:
              - 'admin/admin-panel/**'

  sync-client:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies and Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          cd client
          npm install
          npm run build

      - name: Discord Notification on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [{
              "title": "❌ Sync Client Failed at ${{ github.repository }}",
              "url": "${{ github.event.head_commit.url }}",
              "color": 15548997,
              "fields": [
                {
                  "name": "Nhánh",
                  "value": "`${{ github.ref_name }}`",
                  "inline": true
                },
                {
                  "name": "Người thực hiện",
                  "value": "`${{ github.actor }}`",
                  "inline": true
                },
                {
                  "name": "Nội dung commit",
                  "value": "${{ github.event.head_commit.message }}"
                }
              ],
              "footer": {
                "text": "Hệ thống GEN-HUB"
              },
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}

      - name: Push Client folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'client'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_CLIENT }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync client: ${{ github.event.head_commit.message }}"

  sync-server:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies and Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          cd server
          npm install
          npx prisma generate
          npm run build

      - name: Discord Notification on Failure
        if: failure()
