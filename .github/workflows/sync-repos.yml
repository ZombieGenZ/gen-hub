name: Sync Monorepo to Polyrepos

on:
  push:
    branches:
      - master
    paths:
      - 'client/**'
      - 'server/**'
      - 'status/**'
      - 'App/**'
      - 'admin/admin-panel/**'

  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      status: ${{ steps.filter.outputs.status }}
      app: ${{ steps.filter.outputs.app }}
      admin_panel: ${{ steps.filter.outputs.admin_panel }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'
            status:
              - 'status/**'
            app:
              - 'App/**'
            admin_panel:
              - 'admin/admin-panel/**'

  sync-client:
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies and Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          cd client
          npm install
          npm run build
      - name: Discord Notification on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [{
              "title": "❌ Sync Client Failed at ${{ github.repository }}",
              "url": "${{ github.event.head_commit.url }}",
              "color": 15548997,
              "fields": [
                { "name": "Nhánh", "value": "`${{ github.ref_name }}`", "inline": true },
                { "name": "Người thực hiện", "value": "`${{ github.actor }}`", "inline": true },
                { "name": "Nội dung commit", "value": "${{ github.event.head_commit.message }}" }
              ],
              "footer": { "text": "Hệ thống GEN-HUB" },
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}
      - name: Prepare client sync directory
        run: |
          rm -rf .sync
          mkdir -p .sync
          git -c core.quotepath=false ls-files -z --cached --others --exclude-standard -- client | tar --null -T - -cf - | tar -xf - -C .sync
      - name: Push Client folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: '.sync/client'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_CLIENT }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync client: ${{ github.event.head_commit.message }}"

  sync-server:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies and Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          cd server
          npm install
          npx prisma generate
          npm run build
      - name: Discord Notification on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [{
              "title": "❌ Sync Server Failed at ${{ github.repository }}",
              "url": "${{ github.event.head_commit.url }}",
              "color": 15548997,
              "fields": [
                { "name": "Nhánh", "value": "`${{ github.ref_name }}`", "inline": true },
                { "name": "Người thực hiện", "value": "`${{ github.actor }}`", "inline": true },
                { "name": "Nội dung commit", "value": "${{ github.event.head_commit.message }}" }
              ],
              "footer": { "text": "Hệ thống GEN-HUB" },
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}
      - name: Prepare server sync directory
        run: |
          rm -rf .sync
          mkdir -p .sync
          git -c core.quotepath=false ls-files -z --cached --others --exclude-standard -- server | tar --null -T - -cf - | tar -xf - -C .sync
      - name: Push Server folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: '.sync/server'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_SERVER }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync server: ${{ github.event.head_commit.message }}"

  sync-status:
    needs: changes
    if: ${{ needs.changes.outputs.status == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies and Build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          cd status
          npm install
          npm run build
      - name: Discord Notification on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "embeds": [{
              "title": "❌ Sync Status Failed at ${{ github.repository }}",
              "url": "${{ github.event.head_commit.url }}",
              "color": 15548997,
              "fields": [
                { "name": "Nhánh", "value": "`${{ github.ref_name }}`", "inline": true },
                { "name": "Người thực hiện", "value": "`${{ github.actor }}`", "inline": true },
                { "name": "Nội dung commit", "value": "${{ github.event.head_commit.message }}" }
              ],
              "footer": { "text": "Hệ thống GEN-HUB" },
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }]
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}
      - name: Prepare status sync directory
        run: |
          rm -rf .sync
          mkdir -p .sync
          git -c core.quotepath=false ls-files -z --cached --others --exclude-standard -- status | tar --null -T - -cf - | tar -xf - -C .sync
      - name: Push status folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: '.sync/status'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_STATUS }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync status: ${{ github.event.head_commit.message }}"

  sync-admin-panel:
    needs: changes
    if: ${{ needs.changes.outputs.admin_panel == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies and Build
        run: |
          cd admin/admin-panel
          npm install
          npm run build
      - name: Prepare admin-panel sync directory
        run: |
          rm -rf .sync
          mkdir -p .sync
          git -c core.quotepath=false ls-files -z --cached --others --exclude-standard -- admin/admin-panel | tar --null -T - -cf - | tar -xf - -C .sync
      - name: Push admin-panel folder
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: '.sync/admin/admin-panel'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_ADMIN_PANEL }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "Sync admin-panel: ${{ github.event.head_commit.message }}"

  build-app:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Single-File Executable
        run: |
          cd App/GenHubApp
          dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish
      - name: Prepare App Folder
        run: |
          mkdir app-release
          copy App\GenHubApp\publish\GenHubApp.exe app-release\
      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genhub-app-binary
          path: app-release/
      - name: Discord Notification on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" ^
          -X POST ^
          -d "{\"embeds\": [{\"title\": \"❌ Build App Failed at ${{ github.repository }}\", \"url\": \"${{ github.event.head_commit.url }}\", \"color\": 15548997, \"fields\": [{\"name\": \"Nhánh\", \"value\": \"`${{ github.ref_name }}`\", \"inline\": true}, {\"name\": \"Người thực hiện\", \"value\": \"`${{ github.actor }}`\", \"inline\": true}, {\"name\": \"Nội dung commit\", \"value\": \"${{ github.event.head_commit.message }}\"}], \"footer\": {\"text\": \"Hệ thống GEN-HUB\"}, \"timestamp\": \"${{ github.event.head_commit.timestamp }}\"}]}" ^
          ${{ secrets.DISCORD_WEBHOOK }}

  push-app:
    needs: build-app
    runs-on: ubuntu-latest
    steps:
      - name: Download App Artifact
        uses: actions/download-artifact@v4
        with:
          name: genhub-app-binary
          path: app-release-linux
      - name: Push App to Release Repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'app-release-linux'
          destination-github-username: ${{ secrets.GH_USERNAME }}
          destination-repository-name: ${{ secrets.REPO_APP }}
          user-email: ${{ secrets.GH_EMAIL }}
          target-branch: master
          commit-message: "App Release: ${{ github.event.head_commit.message }}"
